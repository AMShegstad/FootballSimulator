version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:23.0
    steps:
      - checkout

      - restore_cache:
          keys:
            - gradle-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/libs.versions.toml" }}
            - gradle-

      - run:
          name: Build and run tests
          command: ./gradlew clean test

      - save_cache:
          key: gradle-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_test_results:
          path: app/build/test-results/test

      - store_artifacts:
          path: app/build/reports/tests/test
          destination: test-report

workflows:
  ci:
    jobs:
      - build-and-test
